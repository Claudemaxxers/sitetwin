[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ablage"
version = "0.1.0"
description = "SiteTwin Ablage – Ingestion Layer (WhatsApp, E-Mail, Drive, Call) nach Supabase"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "supabase>=2.4",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "pypdf>=4.0",
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["ablage", "ablage.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
